<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LANP</title>
    <!--
      Static boot splash: painted before the JS bundle loads so the window is
      never a blank white flash. Mirrors StartupGate's <StartupScreen /> so the
      handoff to React is seamless; React's createRoot clears #root on mount,
      which removes this automatically.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f7fa;
        font-family: "Outfit", system-ui, sans-serif;
      }
      #boot-splash {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      #boot-splash .boot-logo {
        display: flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #5cc8ff;
      }
      #boot-splash .boot-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #64748b;
      }
      #boot-splash .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-logo">
          <svg width="30" height="26" viewBox="10 14 64 55" fill="#10314a" aria-hidden="true">
            <rect x="10" y="14" width="52" height="13" rx="6.5" opacity="0.4" />
            <rect x="10" y="35" width="52" height="13" rx="6.5" opacity="0.7" />
            <path d="M10 62.5 C10 58.9 12.9 56 16.5 56 L56 56 L74 62.5 L56 69 L16.5 69 C12.9 69 10 66.1 10 62.5 Z" />
          </svg>
        </div>
        <div class="boot-status">
          <span class="boot-spinner"></span>
          <span>Starting the container runtime…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
