apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurgency-server
  namespace: game-servers
  labels:
    app: insurgency-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insurgency-server
  template:
    metadata:
      labels:
        app: insurgency-server
    spec:
      containers:
        - name: insurgency
          # gameservermanagers/gameserver:vints = Vintage Insurgency (2014) via LinuxGSM.
          # Installs the game via steamcmd on first start (~8GB download).
          image: gameservermanagers/gameserver:vints
          ports:
            - name: game-udp
              containerPort: 27015
              protocol: UDP
            - name: game-tcp
              containerPort: 27015
              protocol: TCP
            - name: sourcetv
              containerPort: 27020
              protocol: UDP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: insurgency-data
              mountPath: /data
      volumes:
        - name: insurgency-data
          persistentVolumeClaim:
            claimName: insurgency-data
