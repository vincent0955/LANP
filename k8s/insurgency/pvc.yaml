apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: insurgency-data
  namespace: game-servers
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  # Docker Desktop: "hostpath"
  # minikube:       "standard"
  # k3s:            "local-path"
  storageClassName: hostpath
