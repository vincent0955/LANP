apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-config
  namespace: game-servers
data:
  # EULA must be TRUE or the server will exit immediately on startup.
  EULA: "TRUE"
  TYPE: "VANILLA"
  VERSION: "LATEST"
  # JVM heap size — keep below the container memory limit to leave room for JVM overhead.
  MEMORY: "2G"
  MAX_PLAYERS: "10"
  MOTD: "Local Minecraft Server"
  DIFFICULTY: "normal"
  MODE: "survival"
  ENABLE_RCON: "true"
  # RCON_PASSWORD is stored in the game-secrets Secret, not here.
  RCON_PORT: "25575"
